<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>EDULINEA - Esqueceu a senha</title>
    <link rel="stylesheet" href="style.css">
  </head>
<body>
  <div class="auth-page reset-page">
<img class="logo" src="assets/logo.png" alt="EDULINEA">
<main class="auth-center">
  <div class="lock-hero" aria-hidden="true">
    <svg viewBox="0 0 140 140">
      <circle cx="70" cy="70" r="58"/>
      <path d="M90 29a38 38 0 00-47 58"/>
      <path d="M94 25l12 4-3 13"/>
      <rect x="47" y="50" width="46" height="48" rx="5"/>
      <path d="M56 50V39a14 14 0 0128 0v11"/>
      <circle cx="70" cy="72" r="4"/>
      <path d="M70 76v10"/>
      <path d="M49 107h42v12H49zM57 109v8M66 109v8M75 109v8M84 109v8"/>
    </svg>
  </div>
  <h1 class="auth-title">Esqueceu sua senha?</h1>
  <p class="reset-copy">Digite seu e-mail cadastrado a baixo e<br>enviaremos instruções para criar uma nova</p>
  <span class="label-over">E-mail</span>
  <div class="field-row">
    <span class="field-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48">
        <rect x="3" y="8" width="42" height="31" rx="2"/>
        <path d="M4 10l20 17 20-17M4 38l14-15M44 38L30 23"/>
      </svg>
    </span>
    <input class="pill-input" type="email" aria-label="E-mail">
  </div>
  <a class="primary-btn" href="03-nova-senha.html">Confirmar</a>
</main>
</div>
</body>
</html>
