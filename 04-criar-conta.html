<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>EDULINEA - Criar conta</title>
    <link rel="stylesheet" href="style.css">
  </head>
<body>
  <div class="auth-page register-page">
    <img class="logo" src="assets/logo.png" alt="EDULINEA">
<main class="auth-center">
  <h1 class="auth-title">Crie sua conta</h1>
  <h2 class="auth-subtitle">cadastre-se para começar</h2>
  <form class="register-form">
    <label for="nome">Nome completo</label>
    <input id="nome" type="text" placeholder="Digite seu nome">
    <label for="email">E-mail</label>
    <input id="email" type="email" placeholder="Digite seu e-mail">
    <label for="senha">Senha</label>
    <input id="senha" type="password" placeholder="Digite sua senha">
    <label for="confirmar">confirmar&nbsp; senha</label>
    <input id="confirmar" type="password" placeholder="Digite sua senha novamente">
  </form>
  <a class="primary-btn" href="01-login.html">Criar conta</a>
</main>
</div>
</body>
</html>
