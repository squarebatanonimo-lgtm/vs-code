<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>EDULINEA - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <img class="logo" src="assets/logo.png" alt="EDULINEA">
  <main class="auth-center login">
    <h1 class="auth-title">Bem Vindo(a)</h1>
    <h2 class="auth-subtitle">Faça seu login</h2>

    <div class="field-row">
      <span class="field-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <rect x="3" y="8" width="42" height="31" rx="2"/>
          <path d="M4 10l20 17 20-17M4 38l14-15M44 38L30 23"/>
        </svg>
      </span>
      <input class="pill-input" type="email" placeholder="E-mail" aria-label="E-mail">
    </div>
    <div class="field-row">
      <span class="field-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <rect x="10" y="20" width="28" height="24" rx="3"/>
          <path d="M15 20v-7a9 9 0 0118 0v7"/>
          <circle cx="24" cy="31" r="2"/>
          <path d="M24 33v6"/>
        </svg>
      </span>
      <div class="password-wrap">
        <input class="pill-input" type="password" placeholder="Senha" aria-label="Senha">
        <span class="eye" aria-hidden="true">
          <svg viewBox="0 0 40 28">
            <path d="M2 14s7-9 18-9 18 9 18 9-7 9-18 9S2 14 2 14z"/>
            <circle cx="20" cy="14" r="5"/>
            <path d="M4 25L36 3"/>
          </svg>
        </span>
      </div>
    </div>
    <a class="forgot-link" href="02-esqueceu-senha.html">Esqueceu a senha?</a>
    <a class="primary-btn" href="05-inicio-professor.html">Entrar</a>

    <div class="or-line">
      <span>OU</span>
    </div>
    <div class="social-row">
      <button class="social-btn">
        <span class="google-g">G</span><a class="bgoogle" href="https://accounts.google.com/ServiceLogin?hl=pt-BR&service=mail">Google</a> </button>
      <button class="social-btn">
        <span class="facebook-f">f</span><a class="bfacebook" href="https://www.facebook.com/?locale=pt_BR">Facebook</a></button>
    </div>
  </main>
  <div class="register-line">Ainda não tem conta ? <a href="04-criar-conta.html">Cadastre-se</a>
  </div>
</div>
</body>
</html>
