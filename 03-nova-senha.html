<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>EDULINEA - Nova senha</title>
    <link rel="stylesheet" href="style.css">
  </head>
<body>
  <div class="auth-page newpass">
  <img class="logo" src="assets/logo.png" alt="EDULINEA">
<main class="auth-center">
  <div class="lock-hero" aria-hidden="true">
    <svg viewBox="0 0 140 150">
      <rect x="28" y="55" width="84" height="72" rx="11"/>
      <path d="M43 55V38a27 27 0 0154 0v17"/>

      <path d="M66 95l-4 17h16l-4-17"/>

  </div>
  <h1 class="auth-title">Criar Nova senha</h1>
  <div class="stack-field">
    <label>Nova senha</label>
    <input type="password" placeholder="****">
  </div>
  <div class="stack-field">
    <label>Confirmar nova senha</label>
    <input type="password" placeholder="•••••••">
  </div>
  <a class="primary-btn" href="01-login.html">Redefinir senha</a>
</main>
</div>

</html>
